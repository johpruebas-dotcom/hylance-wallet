<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Control Financiero</title>
    <link rel="stylesheet" href="styles.css">
    <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <div class="container">
        <header>
            <h1>💖 Mi Control Financiero</h1>
            <p class="subtitle">Lleva el control de tus ingresos y gastos</p>
        </header>

        <div class="summary-cards">
            <div class="card income-card">
                <div class="card-icon">💰</div>
                <div class="card-info">
                    <p class="card-label">Ingresos</p>
                    <p class="card-amount" id="total-income">$0.00</p>
                </div>
            </div>
            <div class="card expense-card">
                <div class="card-icon">💸</div>
                <div class="card-info">
                    <p class="card-label">Gastos</p>
                    <p class="card-amount" id="total-expense">$0.00</p>
                </div>
            </div>
            <div class="card balance-card">
                <div class="card-icon">💎</div>
                <div class="card-info">
                    <p class="card-label">Balance</p>
                    <p class="card-amount" id="balance">$0.00</p>
                </div>
            </div>
        </div>

        <div class="main-grid">
            <div class="form-section">
                <h2>📝 Nueva Transacción</h2>
                <form id="transaction-form">
                    <div class="form-group">
                        <label for="type">Tipo</label>
                        <select id="type" required>
                            <option value="income">Ingreso</option>
                            <option value="expense">Gasto</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label for="frequency">Frecuencia</label>
                        <select id="frequency" required>
                            <option value="monthly">Mensual</option>
                            <option value="biweekly">Quincenal</option>
                            <option value="occasional">Ocasional</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label for="description">Descripción</label>
                        <input type="text" id="description" required placeholder="Ej: Salario">
                    </div>
                    <div class="form-group">
                        <label for="amount">Monto</label>
                        <input type="number" id="amount" required min="0" step="0.01" placeholder="0.00">
                    </div>
                    <div class="form-group">
                        <label for="date">Fecha</label>
                        <input type="date" id="date" required>
                    </div>
                    <button type="submit" class="btn-primary">Agregar Transacción</button>
                </form>
            </div>

            <div class="calendar-section">
                <h2>📅 Calendario</h2>
                <div class="calendar-container">
                    <div class="calendar-header">
                        <button id="prev-month">&larr;</button>
                        <h3 id="calendar-title"></h3>
                        <button id="next-month">&rarr;</button>
                    </div>
                    <div class="calendar-weekdays">
                        <div>Dom</div>
                        <div>Lun</div>
                        <div>Mar</div>
                        <div>Mié</div>
                        <div>Jue</div>
                        <div>Vie</div>
                        <div>Sáb</div>
                    </div>
                    <div id="calendar-days" class="calendar-days"></div>
                </div>
            </div>
        </div>

        <div class="transactions-section">
            <h2>📋 Historial de Transacciones</h2>
            <div id="transactions-list" class="transactions-list"></div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
